<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凑十法动画演示（SVG 版）</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --purple: #6c63ff;
    --purple-dark: #4a42c8;
    --gold: #ffd700;
    --gold-light: #ffe44d;
    --blue: #64b5f6;
    --blue-light: #90caf9;
    --green: #4caf50;
    --red: #ff5252;
    --text: #f0f0f0;
    --text-dim: rgba(255,255,255,0.5);
    --card-bg: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.15);
    --shadow: 0 8px 32px rgba(0,0,0,0.3);

    --speed: 1;
    --transition-ms: calc(900ms / var(--speed));
  }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  h1 {
    font-size: 2rem;
    text-align: center;
    padding: 20px 0 4px;
    background: linear-gradient(135deg, var(--gold), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  /* ===== Stage ===== */
  .stage {
    position: relative;
    width: 800px;
    max-width: 95vw;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: opacity calc(var(--transition-ms)) ease;
  }
  .stage.fade-out { opacity: 0; }
  .stage.fade-in { opacity: 1; }

  /* SVG 全宽 */
  .stage-svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 60vh;
  }
  .step-group { display: none; }
  .step-group.active { display: inline; }

  /* ===== Step description ===== */
  .step-desc {
    text-align: center;
    margin-top: 8px;
    font-size: 1.1rem;
    font-weight: 700;
    min-height: 2rem;
    padding: 8px;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    transition: all calc(var(--transition-ms)) ease;
  }

  /* ===== Description log ===== */
  #desc-log {
    margin-top: 8px;
    padding: 6px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .desc-log-item {
    font-size: 0.85rem;
    color: var(--text-dim);
    padding: 3px 0;
    line-height: 1.5;
    animation: slideUp 0.35s ease-out forwards;
  }
  .desc-log-item:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.04); }

  /* ===== Result ===== */
  .result-line {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 900;
    margin-top: 8px;
    padding: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
  }
  .result-line.correct { color: var(--green); }
  .result-line.wrong { color: var(--red); }
  .result-line .big-answer {
    font-size: 1.8rem;
    display: inline-block;
    animation: celebrateBounce 0.6s ease-out forwards;
  }

  /* ===== Controls ===== */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .controls button {
    font-size: 0.95rem;
    font-weight: 700;
    padding: 8px 18px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.05);
  }
  .controls button:active { transform: scale(0.95); }
  .controls button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .controls button.primary {
    background: var(--purple);
    border-color: var(--gold);
  }
  .controls button.primary:hover { background: var(--purple-dark); }
  .controls button.green { background: var(--green); border-color: var(--green); }
  .controls button.return-btn {
    background: rgba(255,255,255,0.06);
    border-color: var(--text-dim);
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .controls button.return-btn:hover {
    background: rgba(255,255,255,0.15);
    color: var(--text);
  }

  .step-dots {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .step-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: all 0.2s ease;
  }
  .step-dot.active { background: var(--gold); transform: scale(1.3); }
  .step-dot.done { background: var(--green); }

  /* ===== Speed control ===== */
  .speed-section {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .speed-section label { font-size: 0.9rem; color: var(--text-dim); }
  .speed-section input[type="range"] {
    width: 120px;
    accent-color: var(--purple);
    cursor: pointer;
  }
  .speed-btn-group { display: flex; gap: 4px; }
  .speed-btn {
    font-size: 0.75rem !important;
    padding: 3px 12px !important;
    border-radius: 16px !important;
    border: 1px solid var(--border) !important;
  }
  .speed-btn.active {
    background: var(--purple) !important;
    border-color: var(--gold) !important;
  }
  #speed-label {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--gold);
    min-width: 30px;
    text-align: center;
  }

  /* ===== Animations ===== */
  @keyframes popIn {
    0%   { transform: scale(0);   opacity: 0; }
    60%  { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1);   opacity: 1; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(1.15); }
  }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(255,215,0,0.3)); }
    50%      { filter: drop-shadow(0 0 12px rgba(255,215,0,0.8)); }
  }
  @keyframes celebrateBounce {
    0%   { transform: scale(0); }
    50%  { transform: scale(1.4); }
    70%  { transform: scale(0.9); }
    100% { transform: scale(1); }
  }
  @keyframes slideUp {
    0%   { transform: translateY(10px); opacity: 0; }
    100% { transform: translateY(0);    opacity: 1; }
  }

  /* ===== SVG 元素动画适配 ===== */
  .svg-pop-in {
    transform-box: fill-box;
    transform-origin: center;
    animation: popIn calc(var(--transition-ms)) ease-out forwards;
  }
  .svg-blink {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 1.2s ease-in-out infinite;
  }
  .svg-glow {
    animation: glowPulse 1s ease-in-out infinite;
  }
  .svg-dim {
    opacity: 0.25;
    transform: scale(0.8);
    transform-box: fill-box;
    transform-origin: center;
    transition: all calc(var(--transition-ms)) ease;
  }

  /* ===== Legend ===== */
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 4px;
    margin-bottom: 6px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .legend-dot.a-dot { background: var(--gold); }
  .legend-dot.b-dot { background: var(--blue); }

  @media (max-width: 600px) {
    h1 { font-size: 1.3rem; }
    .stage { padding: 12px 10px; }
    .step-desc { font-size: 0.95rem; }
    .controls button { font-size: 0.8rem; padding: 6px 12px; }
    .result-line { font-size: 1.1rem; }
    .result-line .big-answer { font-size: 1.5rem; }
    .legend { font-size: 0.65rem; gap: 10px; }
  }
</style>
</head>
<body>

<h1>🔟 凑十法</h1>
<div class="subtitle" id="subtitle">动画演示 · 数位可视化（SVG 版）</div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot a-dot"></span> 第一个数</div>
  <div class="legend-item"><span class="legend-dot b-dot"></span> 第二个数</div>
</div>

<div class="stage" id="stage">
  <!-- 单一 SVG 内含 4 个步骤组 -->
  <svg viewBox="0 0 800 480" class="stage-svg" id="stage-svg" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#ffe44d"/>
        <stop offset="100%" stop-color="#ffd700"/>
      </linearGradient>
      <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#90caf9"/>
        <stop offset="100%" stop-color="#64b5f6"/>
      </linearGradient>
      <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#8b85ff"/>
        <stop offset="100%" stop-color="#6c63ff"/>
      </linearGradient>
      <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="b"/>
        <feFlood flood-color="#4caf50" flood-opacity="0.6"/>
        <feComposite in2="b" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- ========== Step 1: 认识两个数 ========== -->
    <g id="step1-group" class="step-group">
      <!-- Column headers -->
      <text x="220" y="55" text-anchor="middle" fill="#6c63ff" font-size="18" font-weight="700" letter-spacing="2">十位 (10个一)</text>
      <text x="590" y="55" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="700" letter-spacing="2">个位</text>

      <!-- Tens column: 容器由 JS 填充 -->
      <g id="s1-tens" data-col="tens" data-step="1"></g>
      <!-- Ones column rows: 容器由 JS 填充 -->
      <g id="s1-a-ones" data-row="a"></g>
      <g id="s1-a-label-row"></g>
      <g id="s1-b-ones" data-row="b"></g>
      <g id="s1-b-label-row"></g>
    </g>

    <!-- ========== Step 2: 找朋友 ========== -->
    <g id="step2-group" class="step-group">
      <text x="220" y="55" text-anchor="middle" fill="#6c63ff" font-size="18" font-weight="700" letter-spacing="2">十位</text>
      <text x="590" y="55" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="700" letter-spacing="2">个位</text>

      <g id="s2-tens" data-col="tens" data-step="2"></g>
      <g id="s2-a-ones" data-row="a"></g>
      <text x="590" y="200" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="22" font-weight="700" id="s2-plus">+</text>
      <g id="s2-b-ones" data-row="b"></g>
    </g>

    <!-- ========== Step 3: 凑成新十位 ========== -->
    <g id="step3-group" class="step-group">
      <text x="220" y="55" text-anchor="middle" fill="#6c63ff" font-size="18" font-weight="700" letter-spacing="2">十位</text>
      <text x="590" y="55" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="700" letter-spacing="2">个位</text>

      <g id="s3-tens" data-col="tens" data-step="3"></g>
      <g id="s3-ones" data-row="remain"></g>
      <text x="590" y="320" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" id="s3-empty" style="display:none">（没有剩余个位）</text>
    </g>

    <!-- ========== Step 4: 计算结果 ========== -->
    <g id="step4-group" class="step-group">
      <text x="220" y="55" text-anchor="middle" fill="#6c63ff" font-size="18" font-weight="700" letter-spacing="2">十位</text>
      <text x="590" y="55" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="700" letter-spacing="2">个位</text>

      <g id="s4-tens" data-col="tens" data-step="4"></g>
      <g id="s4-ones" data-row="remain"></g>
      <text x="590" y="320" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" id="s4-empty" style="display:none">（没有剩余个位）</text>
    </g>

    <!-- 飞行动画层（位于所有步骤之上） -->
    <g id="fly-layer"></g>
  </svg>

  <!-- 步骤说明文字 -->
  <div class="step-desc" id="step-desc"></div>
  <!-- 步骤 4 结果行 -->
  <div class="result-line" id="result-line" style="display:none"></div>
  <!-- 描述日志 -->
  <div id="desc-log"></div>
</div>

<!-- Controls -->
<div class="controls">
  <button id="btn-return" class="return-btn" title="返回主应用">↩ 返回</button>
  <button id="btn-prev" disabled>← 上一步</button>
  <button id="btn-auto" class="primary">▶ 自动播放</button>
  <button id="btn-replay">↻ 重播</button>
  <button id="btn-next" class="primary">下一步 →</button>
  <div class="step-dots" id="step-dots">
    <span class="step-dot" data-step="1"></span>
    <span class="step-dot" data-step="2"></span>
    <span class="step-dot" data-step="3"></span>
    <span class="step-dot" data-step="4"></span>
    <span style="margin-left:4px;" id="step-text">1/4</span>
  </div>
</div>

<!-- Speed control -->
<div class="speed-section">
  <label>🎬 速度</label>
  <input type="range" id="speed-slider" min="0.25" max="2.5" step="0.25" value="1">
  <span id="speed-label">1x</span>
  <div class="speed-btn-group">
    <button class="speed-btn" data-speed="0.5">🐢 慢</button>
    <button class="speed-btn active" data-speed="1">🐰 正常</button>
    <button class="speed-btn" data-speed="2">🐆 快</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== 几何常量（SVG 坐标系） =====
  const TENS_CX = 220;          // 十位列中心 x
  const ONES_CX = 590;          // 个位列中心 x
  const TEN_GROUP_Y0 = 90;      // 第一个十位组 y
  const TEN_GROUP_GAP = 28;     // 十位组之间垂直间距
  const ONE_DOT_R = 12;         // 个位圆点半径
  const ONE_DOT_SPACING = 30;   // 个位圆点间距
  const TEN_DOT_R = 6;          // 十位圆点半径
  const TEN_DOT_SPACING = 14;   // 十位圆点间距
  const ROW_A_Y = 130;          // step1/2 中 a 的个位行 y
  const ROW_B_Y = 240;          // step1/2 中 b 的个位行 y
  const ROW_REMAIN_Y = 200;     // step3/4 中剩余个位 y

  // ===== Parse params =====
  const params = new URLSearchParams(window.location.search);
  const rawA = params.get('a');
  const rawB = params.get('b');
  const rawAnswer = params.get('answer');

  let a = 8, b = 5, userAnswer = null;
  let hasParams = false;

  if (rawA !== null && rawB !== null) {
    const pa = parseInt(rawA, 10);
    const pb = parseInt(rawB, 10);
    if (!isNaN(pa) && !isNaN(pb) && pa > 0 && pb > 0) {
      a = pa; b = pb;
      hasParams = true;
      if (rawAnswer !== null) {
        const pa2 = parseInt(rawAnswer, 10);
        if (!isNaN(pa2)) userAnswer = pa2;
      }
    }
  }

  if (!hasParams) {
    document.getElementById('subtitle').textContent = '演示示例：8 + 5（SVG 版）';
  }

  // ===== Compute =====
  const target = Math.ceil(a / 10) * 10;
  const aTens = Math.floor(a / 10);
  const aOnes = a % 10;
  const splitFirst = target - a;
  const splitSecond = b - splitFirst;
  const answer = a + b;
  const isCorrect = userAnswer !== null ? userAnswer === answer : null;

  // ===== State =====
  let currentStep = 1;
  let isAutoPlaying = false;
  let autoTimer = null;
  let speed = 1;
  let isTransitioning = false;
  let _step2Merged = false;
  let _descLog = new Set();

  // ===== SVG 命名空间 =====
  const SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      for (const k in attrs) el.setAttribute(k, attrs[k]);
    }
    return el;
  }

  // ===== Description log =====
  function appendToDescLog(text) {
    if (!text || _descLog.has(text)) return;
    _descLog.add(text);
    const log = document.getElementById('desc-log');
    const item = document.createElement('div');
    item.className = 'desc-log-item';
    item.textContent = text;
    log.appendChild(item);
  }
  function clearDescLog() {
    document.getElementById('desc-log').innerHTML = '';
    _descLog = new Set();
  }

  // ===== DOM refs =====
  const stage = document.getElementById('stage');
  const stepGroups = {
    1: document.getElementById('step1-group'),
    2: document.getElementById('step2-group'),
    3: document.getElementById('step3-group'),
    4: document.getElementById('step4-group'),
  };
  const dotEls = document.querySelectorAll('.step-dot');
  const stepText = document.getElementById('step-text');
  const stepDescEl = document.getElementById('step-desc');
  const resultEl = document.getElementById('result-line');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const btnAuto = document.getElementById('btn-auto');
  const btnReplay = document.getElementById('btn-replay');
  const btnReturn = document.getElementById('btn-return');
  const speedSlider = document.getElementById('speed-slider');
  const speedLabel = document.getElementById('speed-label');
  const speedBtns = document.querySelectorAll('.speed-btn');
  const flyLayer = document.getElementById('fly-layer');

  // ===== 清除容器 =====
  function clearGroup(parent) {
    while (parent.firstChild) parent.removeChild(parent.firstChild);
  }

  // ===== 创建个位圆点 =====
  function createOneDot(value, type, extras) {
    extras = extras || {};
    const cx = extras.cx;
    const cy = extras.cy;
    const cls = extras.cls || '';
    const clsPop = extras.popIn ? ' svg-pop-in' : '';
    const clsBlink = extras.blink ? ' svg-blink' : '';
    const clsDim = extras.dim ? ' svg-dim' : '';
    const finalCls = (type === 'a' ? 'a-type' : 'b-type') + clsPop + clsBlink + clsDim;
    const fill = type === 'a' ? 'url(#goldGrad)' : 'url(#blueGrad)';
    const g = svgEl('g', { class: finalCls });
    if (extras.popInDelay) {
      g.style.animationDelay = extras.popInDelay + 's';
    }
    if (extras.blinkDelay) {
      g.style.animationDelay = (parseFloat(g.style.animationDelay || '0') + extras.blinkDelay) + 's';
    }
    const circle = svgEl('circle', {
      cx: cx, cy: cy, r: ONE_DOT_R,
      fill: fill,
      stroke: extras.blink ? '#4caf50' : 'none',
      'stroke-width': extras.blink ? 2 : 0,
    });
    g.appendChild(circle);
    if (extras.showValue !== false) {
      const text = svgEl('text', {
        x: cx, y: cy + 4,
        'text-anchor': 'middle',
        'font-size': '13',
        'font-weight': '800',
        fill: '#1a1a2e',
        'pointer-events': 'none',
      });
      text.textContent = value;
      g.appendChild(text);
    }
    return g;
  }

  // ===== 创建十位组（10 个小圆点） =====
  function createTenGroup(goldCount, blueCount, extras) {
    extras = extras || {};
    const total = goldCount + blueCount;
    const startX = TENS_CX - (10 * TEN_DOT_SPACING) / 2 + TEN_DOT_SPACING / 2;
    const cy = extras.cy;
    const cls = 'ten-group' + (extras.popIn ? ' svg-pop-in' : '') +
                (extras.glow ? ' svg-glow' : '');
    const g = svgEl('g', { class: cls });
    if (extras.popInDelay) {
      g.style.animationDelay = extras.popInDelay + 's';
    }
    for (let i = 0; i < 10; i++) {
      let fill = 'transparent';
      if (i < goldCount) {
        fill = 'url(#goldGrad)';
      } else if (i < total) {
        fill = 'url(#blueGrad)';
      } else {
        // 空槽位：画一个淡色描边的虚位
        fill = 'rgba(255,255,255,0.05)';
      }
      const circle = svgEl('circle', {
        cx: startX + i * TEN_DOT_SPACING,
        cy: cy,
        r: TEN_DOT_R,
        fill: fill,
        stroke: fill === 'rgba(255,255,255,0.05)' ? 'rgba(255,255,255,0.15)' : 'none',
        'stroke-width': fill === 'rgba(255,255,255,0.05)' ? 1 : 0,
      });
      g.appendChild(circle);
    }
    return g;
  }

  // ===== 计算一排个位圆点的中心 x 偏移 =====
  function rowXOffsets(count, cx) {
    const totalW = (count - 1) * ONE_DOT_SPACING;
    const startX = cx - totalW / 2;
    return Array.from({ length: count }, (_, i) => startX + i * ONE_DOT_SPACING);
  }

  // ===== 渲染：步骤 1 =====
  function renderStep1() {
    // Tens column
    const tensEl = document.getElementById('s1-tens');
    clearGroup(tensEl);
    if (aTens === 0) {
      tensEl.appendChild(svgEl('text', {
        x: TENS_CX, y: 180, 'text-anchor': 'middle',
        fill: 'rgba(255,255,255,0.5)', 'font-size': 14,
      })).textContent = '（没有十位）';
    } else {
      for (let i = 0; i < aTens; i++) {
        tensEl.appendChild(createTenGroup(10, 0, {
          cy: TEN_GROUP_Y0 + i * TEN_GROUP_GAP,
          popIn: true,
          popInDelay: i * 0.1,
        }));
      }
    }

    // A's ones (gold)
    const aOnesEl = document.getElementById('s1-a-ones');
    clearGroup(aOnesEl);
    const aXs = rowXOffsets(aOnes, ONES_CX);
    aXs.forEach((x, i) => {
      aOnesEl.appendChild(createOneDot(i + 1, 'a', {
        cx: x, cy: ROW_A_Y,
        popIn: true,
        popInDelay: i * 0.06,
      }));
    });

    // A label
    const aLabelEl = document.getElementById('s1-a-label-row');
    clearGroup(aLabelEl);
    aLabelEl.appendChild(svgEl('text', {
      x: ONES_CX, y: ROW_A_Y + 38,
      'text-anchor': 'middle',
      fill: 'rgba(255,255,255,0.5)', 'font-size': 12,
    })).textContent = `${a} = ${aTens > 0 ? '1个十 + ' : ''}${aOnes}个一`;

    // B's ones (blue)
    const bOnesEl = document.getElementById('s1-b-ones');
    clearGroup(bOnesEl);
    const bXs = rowXOffsets(b, ONES_CX);
    bXs.forEach((x, i) => {
      bOnesEl.appendChild(createOneDot(i + 1, 'b', {
        cx: x, cy: ROW_B_Y,
        popIn: true,
        popInDelay: i * 0.06 + 0.25,
      }));
    });

    // B label
    const bLabelEl = document.getElementById('s1-b-label-row');
    clearGroup(bLabelEl);
    bLabelEl.appendChild(svgEl('text', {
      x: ONES_CX, y: ROW_B_Y + 38,
      'text-anchor': 'middle',
      fill: 'rgba(255,255,255,0.5)', 'font-size': 12,
    })).textContent = `${b} = ${b}个一`;

    stepDescEl.textContent = `✨ ${a} 和 ${b}，我们一起看看它们各有几个十和几个一！`;
  }

  // ===== 渲染：步骤 2 =====
  function renderStep2() {
    const tensEl = document.getElementById('s2-tens');
    clearGroup(tensEl);
    if (aTens === 0) {
      tensEl.appendChild(svgEl('text', {
        x: TENS_CX, y: 180, 'text-anchor': 'middle',
        fill: 'rgba(255,255,255,0.5)', 'font-size': 14,
      })).textContent = '（没有十位）';
    } else {
      for (let i = 0; i < aTens; i++) {
        tensEl.appendChild(createTenGroup(10, 0, {
          cy: TEN_GROUP_Y0 + i * TEN_GROUP_GAP,
        }));
      }
    }

    // A's ones: all blinking (they all need friends)
    const aOnesEl = document.getElementById('s2-a-ones');
    clearGroup(aOnesEl);
    const aXs = rowXOffsets(aOnes, ONES_CX);
    aXs.forEach((x, i) => {
      aOnesEl.appendChild(createOneDot(i + 1, 'a', {
        cx: x, cy: ROW_A_Y,
        blink: true,
        blinkDelay: i * 0.05,
      }));
    });

    // B's ones: friends blink, rest dim
    const bOnesEl = document.getElementById('s2-b-ones');
    clearGroup(bOnesEl);
    const bXs = rowXOffsets(b, ONES_CX);
    bXs.forEach((x, i) => {
      const isFriend = i < splitFirst;
      bOnesEl.appendChild(createOneDot(i + 1, 'b', {
        cx: x, cy: ROW_B_Y,
        blink: isFriend,
        dim: !isFriend,
        blinkDelay: i * 0.05,
      }));
    });

    stepDescEl.textContent =
      `🔍 ${aOnes}需要好朋友${splitFirst}！` +
      ` ${b}要拆成${splitFirst}和${splitSecond}，` +
      `${splitFirst}会和${aOnes}做朋友，一起凑成10！`;
  }

  // ===== 渲染：步骤 3 =====
  function renderStep3() {
    const tensEl = document.getElementById('s3-tens');
    clearGroup(tensEl);
    for (let i = 0; i < aTens; i++) {
      tensEl.appendChild(createTenGroup(10, 0, {
        cy: TEN_GROUP_Y0 + i * TEN_GROUP_GAP,
      }));
    }
    // New ten — mixed: aOnes gold + splitFirst blue
    tensEl.appendChild(createTenGroup(aOnes, splitFirst, {
      cy: TEN_GROUP_Y0 + aTens * TEN_GROUP_GAP,
      popIn: true,
      popInDelay: 0.4,
    }));

    // Remaining ones
    const onesEl = document.getElementById('s3-ones');
    clearGroup(onesEl);
    const emptyEl = document.getElementById('s3-empty');
    if (splitSecond > 0) {
      emptyEl.style.display = 'none';
      const xs = rowXOffsets(splitSecond, ONES_CX);
      xs.forEach((x, i) => {
        onesEl.appendChild(createOneDot(i + 1, 'b', {
          cx: x, cy: ROW_REMAIN_Y,
          popIn: true,
          popInDelay: i * 0.06 + 0.6,
        }));
      });
    } else {
      emptyEl.style.display = '';
    }

    stepDescEl.textContent =
      `🎯 ${aOnes} + ${splitFirst} = 10，凑成 1 个新十位！`;
  }

  // ===== 渲染：步骤 4 =====
  function renderStep4() {
    const tensEl = document.getElementById('s4-tens');
    clearGroup(tensEl);
    const totalTens = aTens + 1;
    for (let i = 0; i < totalTens; i++) {
      const isNew = i >= aTens;
      tensEl.appendChild(createTenGroup(
        isNew ? aOnes : 10,
        isNew ? splitFirst : 0,
        {
          cy: TEN_GROUP_Y0 + i * TEN_GROUP_GAP,
          popIn: isNew,
          glow: isNew,
          popInDelay: i * 0.1,
        }
      ));
    }

    const onesEl = document.getElementById('s4-ones');
    clearGroup(onesEl);
    const emptyEl = document.getElementById('s4-empty');
    if (splitSecond > 0) {
      emptyEl.style.display = 'none';
      const xs = rowXOffsets(splitSecond, ONES_CX);
      xs.forEach((x, i) => {
        onesEl.appendChild(createOneDot(i + 1, 'b', {
          cx: x, cy: ROW_REMAIN_Y,
          popIn: true,
          popInDelay: i * 0.06 + 0.3,
        }));
      });
    } else {
      emptyEl.style.display = '';
    }

    stepDescEl.textContent = `✅ ${totalTens} 个十 + ${splitSecond} 个一 = ${answer}`;

    resultEl.style.display = '';
    if (userAnswer !== null) {
      if (isCorrect) {
        resultEl.className = 'result-line correct';
        resultEl.innerHTML = `🎉 回答正确！<span class="big-answer">${answer}</span> ✓`;
      } else {
        resultEl.className = 'result-line wrong';
        resultEl.innerHTML = `你的答案 ${userAnswer} · 正确答案是 <span class="big-answer">${answer}</span>`;
      }
    } else {
      resultEl.className = 'result-line';
      resultEl.innerHTML = `答案：<span class="big-answer">${answer}</span>`;
    }
  }

  // ===== Step 2 合并动画：SVG 圆点飞入新十位 =====
  function doStep2Merge() {
    if (_step2Merged || isTransitioning) return;
    isTransitioning = true;

    // 收集 step 2 中所有 blinking 的圆点
    const blinkingDots = stepGroups[2].querySelectorAll('.svg-blink');
    if (blinkingDots.length === 0) {
      _step2Merged = true;
      isTransitioning = false;
      goToStep(3);
      return;
    }

    btnNext.disabled = true;
    const mergeDesc = `🤝 ${aOnes}和${splitFirst}做好朋友，飞去十位凑成10！`;
    stepDescEl.textContent = mergeDesc;
    appendToDescLog(mergeDesc);

    // 隐藏原始 blinking 圆点
    blinkingDots.forEach(g => { g.style.opacity = '0'; });

    // 计算新十位组的目标位置
    const newGroupY = TEN_GROUP_Y0 + aTens * TEN_GROUP_GAP;
    const newGroupStartX = TENS_CX - (10 * TEN_DOT_SPACING) / 2 + TEN_DOT_SPACING / 2;
    // 决定新十位组里 aOnes 个金色 + splitFirst 个蓝色的位置：
    //   - 前 aOnes 个位置放金色（来自 a 的个位）
    //   - 接下来 splitFirst 个位置放蓝色（来自 b 的朋友）
    //   - 收集 blinkingDots 时按 a-ones(全 blink) + b-ones(前 splitFirst blink) 顺序
    //   所以前 aOnes 个飞向新十位组的前 aOnes 个位置（变金色小点）
    //   接下来 splitFirst 个飞向新十位组接下来的 splitFirst 个位置（变蓝色小点）

    // 为了动画的视觉一致性，飞入的圆点尺寸与新十位组的十位小点一致
    const targetR = TEN_DOT_R;

    // 收集 blinkingDots 的源位置（屏幕坐标 → SVG 坐标需要变换）
    const svgRect = document.getElementById('stage-svg').getBoundingClientRect();
    const svgViewBox = document.getElementById('stage-svg').viewBox.baseVal;
    const scaleX = svgRect.width / svgViewBox.width;
    const scaleY = svgRect.height / svgViewBox.height;

    function screenToSvg(screenX, screenY) {
      return {
        x: (screenX - svgRect.left) / scaleX,
        y: (screenY - svgRect.top) / scaleY,
      };
    }

    const sources = [];
    blinkingDots.forEach(g => {
      const r = g.getBoundingClientRect();
      const center = screenToSvg(r.left + r.width / 2, r.top + r.height / 2);
      // 颜色：a 的圆点是金色，b 的圆点是蓝色
      const isA = g.classList.contains('a-type');
      sources.push({ x: center.x, y: center.y, isA: isA });
    });

    // 目标位置：按 [a 的 aOnes 个] + [b 的 splitFirst 个] 顺序填入新十位组
    const targets = [];
    for (let i = 0; i < aOnes; i++) {
      targets.push({ x: newGroupStartX + i * TEN_DOT_SPACING, y: newGroupY, isA: true });
    }
    for (let i = 0; i < splitFirst; i++) {
      targets.push({ x: newGroupStartX + (aOnes + i) * TEN_DOT_SPACING, y: newGroupY, isA: false });
    }

    // 创建飞行的圆点（使用 SMIL <animate> 动画 cx/cy/r）
    const flyDuration = 1.2 / speed; // 秒
    const stagger = 0.08 / speed;    // 错位延迟
    sources.forEach((src, i) => {
      if (i >= targets.length) return;
      const tgt = targets[i];
      const c = svgEl('circle', {
        cx: src.x, cy: src.y, r: ONE_DOT_R,
        fill: src.isA ? 'url(#goldGrad)' : 'url(#blueGrad)',
        opacity: 0.95,
        filter: 'url(#greenGlow)',
      });
      // SMIL animate
      const aX = svgEl('animate', {
        attributeName: 'cx',
        dur: flyDuration + 's',
        begin: (i * stagger) + 's',
        fill: 'freeze',
        calcMode: 'spline',
        keySplines: '0.4 0 0.2 1',
        keyTimes: '0;1',
        values: src.x + ';' + tgt.x,
      });
      const aY = svgEl('animate', {
        attributeName: 'cy',
        dur: flyDuration + 's',
        begin: (i * stagger) + 's',
        fill: 'freeze',
        calcMode: 'spline',
        keySplines: '0.4 0 0.2 1',
        keyTimes: '0;1',
        values: src.y + ';' + tgt.y,
      });
      const aR = svgEl('animate', {
        attributeName: 'r',
        dur: flyDuration + 's',
        begin: (i * stagger) + 's',
        fill: 'freeze',
        values: ONE_DOT_R + ';' + targetR,
      });
      c.appendChild(aX);
      c.appendChild(aY);
      c.appendChild(aR);
      flyLayer.appendChild(c);
    });

    // 飞行结束后清理并进入 step 3
    const totalFly = flyDuration + (sources.length - 1) * stagger + 0.2;
    setTimeout(() => {
      // 清除飞行的圆点
      while (flyLayer.firstChild) flyLayer.removeChild(flyLayer.firstChild);
      _step2Merged = true;
      isTransitioning = false;
      btnNext.disabled = false;
      if (currentStep === 2 && _step2Merged) {
        goToStep(3);
      }
    }, totalFly * 1000);
  }

  // ===== 切换步骤 =====
  function goToStep(step) {
    if (isTransitioning || step < 1 || step > 4) return;
    if (step === currentStep) return;

    // 2→3 过渡：先播放合并动画
    if (currentStep === 2 && step === 3 && !_step2Merged) {
      doStep2Merge();
      return;
    }

    isTransitioning = true;
    const prevStep = currentStep;
    currentStep = step;

    stage.classList.add('fade-out');

    setTimeout(() => {
      // 隐藏所有步骤组
      Object.values(stepGroups).forEach(g => g.classList.remove('active'));
      // 隐藏结果行（除 step 4）
      resultEl.style.display = 'none';

      // 渲染目标步骤
      switch (step) {
        case 1: renderStep1(); break;
        case 2: renderStep2(); _step2Merged = false; break;
        case 3: renderStep3(); break;
        case 4: renderStep4(); break;
      }
      stepGroups[step].classList.add('active');

      // 前进时记录描述
      if (step > prevStep) {
        if (stepDescEl.textContent) {
          appendToDescLog(stepDescEl.textContent);
        }
        if (step === 4) {
          appendToDescLog(resultEl.textContent.replace(/<[^>]*>/g, ''));
        }
      }

      stage.classList.remove('fade-out');
      stage.classList.add('fade-in');

      dotEls.forEach((dot, i) => {
        const s = i + 1;
        dot.className = 'step-dot';
        if (s < step) dot.classList.add('done');
        else if (s === step) dot.classList.add('active');
      });
      stepText.textContent = step + '/4';
      btnPrev.disabled = step === 1;
      btnNext.disabled = step === 4;

      setTimeout(() => {
        stage.classList.remove('fade-in');
        isTransitioning = false;
      }, 300);
    }, 300);
  }

  // ===== Reset =====
  function resetToStep1() {
    stopAutoPlay();
    clearDescLog();
    goToStep(1);
  }

  // ===== Auto play =====
  function startAutoPlay() {
    if (isAutoPlaying) return;
    isAutoPlaying = true;
    btnAuto.textContent = '⏸ 暂停';
    btnAuto.className = 'green';
    if (currentStep === 4) {
      goToStep(1);
    }
    scheduleNextAuto();
  }
  function scheduleNextAuto() {
    if (!isAutoPlaying) return;
    const delay = Math.round(3800 / speed);
    autoTimer = setTimeout(() => {
      if (currentStep < 4) {
        goToStep(currentStep + 1);
        scheduleNextAuto();
      } else {
        stopAutoPlay();
      }
    }, delay);
  }
  function stopAutoPlay() {
    isAutoPlaying = false;
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    btnAuto.textContent = '▶ 自动播放';
    btnAuto.className = 'primary';
  }
  function toggleAutoPlay() {
    if (isAutoPlaying) stopAutoPlay();
    else startAutoPlay();
  }

  // ===== Speed =====
  function setSpeed(val) {
    speed = val;
    document.documentElement.style.setProperty('--speed', speed);
    speedLabel.textContent = speed + 'x';
    speedSlider.value = speed;
    speedBtns.forEach(btn => {
      btn.classList.toggle('active', parseFloat(btn.dataset.speed) === speed);
    });
    if (isAutoPlaying) {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
      scheduleNextAuto();
    }
  }

  // ===== Return =====
  btnReturn.addEventListener('click', () => {
    window.close();
    setTimeout(() => { window.location.href = '/'; }, 500);
  });

  // ===== Event listeners =====
  btnNext.addEventListener('click', () => {
    if (isAutoPlaying) stopAutoPlay();
    if (currentStep < 4) goToStep(currentStep + 1);
  });
  btnPrev.addEventListener('click', () => {
    if (isAutoPlaying) stopAutoPlay();
    if (currentStep > 1) goToStep(currentStep - 1);
  });
  btnAuto.addEventListener('click', toggleAutoPlay);
  btnReplay.addEventListener('click', resetToStep1);

  speedSlider.addEventListener('input', () => {
    setSpeed(parseFloat(speedSlider.value));
  });
  speedBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      setSpeed(parseFloat(btn.dataset.speed));
    });
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      btnNext.click();
    }
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      btnPrev.click();
    }
    if (e.key === 'r' || e.key === 'R') {
      btnReplay.click();
    }
    if (e.key === 'a' || e.key === 'A') {
      btnAuto.click();
    }
    if (e.key === 'Escape') {
      btnReturn.click();
    }
  });

  // ===== Init =====
  function init() {
    renderStep1();
    stepGroups[1].classList.add('active');
    dotEls[0].classList.add('active');
    stepText.textContent = '1/4';

    // 页面加载 1 秒后开始自动播放
    setTimeout(() => { startAutoPlay(); }, 1000);
  }

  init();
})();
</script>
</body>
</html>
