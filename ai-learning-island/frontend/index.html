<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>AI 学习岛</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<!-- 全屏游戏画布 -->
<canvas id="game-canvas"></canvas>

<!-- 登录/注册页 -->
<div id="login-page" class="login-page">
  <div class="login-form">
    <div class="login-title">🌟 AI 学习岛</div>
    <div class="login-tabs">
      <button class="login-tab active" data-tab="login" onclick="switchLoginTab('login')">登录</button>
      <button class="login-tab" data-tab="register" onclick="switchLoginTab('register')">注册</button>
    </div>
    <div id="login-fields" class="login-fields">
      <input id="login-username" class="login-input" type="text" placeholder="用户名" autocomplete="username">
      <input id="login-password" class="login-input" type="password" placeholder="密码" autocomplete="current-password">
      <button class="login-btn" onclick="doLogin()">🔑 登录</button>
    </div>
    <div id="register-fields" class="login-fields hidden">
      <input id="reg-name" class="login-input" type="text" placeholder="孩子的名字（小名）">
      <input id="reg-username" class="login-input" type="text" placeholder="用户名（用于登录）" autocomplete="username">
      <input id="reg-password" class="login-input" type="password" placeholder="密码" autocomplete="new-password">
      <select id="reg-age" class="login-input login-select">
        <option value="4">4岁</option>
        <option value="5">5岁</option>
        <option value="6" selected>6岁</option>
        <option value="7">7岁</option>
        <option value="8">8岁</option>
        <option value="9">9岁</option>
        <option value="10">10岁</option>
      </select>
      <button class="login-btn" onclick="doRegister()">✨ 注册</button>
    </div>
    <div id="login-error" class="login-error hidden"></div>
  </div>
</div>

<!-- 学科入口页（新 v2.0） -->
<div id="subject-select" class="hidden">
  <div class="subject-title">🗺️ 学习大陆</div>
  <div class="subject-grid">
    <button class="subject-btn" onclick="selectSubject('math')">
      <span class="subject-icon">🔢</span>
      <span class="subject-name">数学大陆</span>
      <span class="subject-status ready">🌱 萌芽森林</span>
    </button>
    <button class="subject-btn disabled" onclick="">
      <span class="subject-icon">📖</span>
      <span class="subject-name">语文书院</span>
      <span class="subject-status">即将开放</span>
    </button>
    <button class="subject-btn disabled" onclick="">
      <span class="subject-icon">🌐</span>
      <span class="subject-name">英语世界</span>
      <span class="subject-status">即将开放</span>
    </button>
  </div>
</div>

<!-- 路线图页（新 v2.0） -->
<div id="map-view" class="hidden">
  <div class="map-header">
    <button class="back-btn" onclick="showSubjectSelectFromMap()">← 返回</button>
    <div id="map-title" class="map-title">🗺️ 学习路线图</div>
  </div>
  <div id="module-list" class="module-list"></div>
</div>

<!-- HUD 覆盖层 -->
<div id="hud">
  <div id="hud-left">
    <span id="crystal-count">💎 0</span>
    <span id="streak-days">🔥 0天</span>
  </div>
  <div id="hud-right">
    <span id="zone-name">🏠 蘑菇屋</span>
    <span id="friendship-badge">🤝 好朋友</span>
    <button id="profile-btn" class="profile-menu-btn" onclick="openProfilePanel()">👤</button>
  </div>
</div>

<!-- 个人资料面板 -->
<div id="profile-panel" class="hidden fullscreen-panel">
  <div class="panel-title">👤 个人资料</div>
  <div class="profile-content">
    <div class="profile-field">
      <label>名字</label>
      <input id="profile-name" class="login-input" type="text">
    </div>
    <div class="profile-field">
      <label>年龄</label>
      <select id="profile-age" class="login-input login-select">
        <option value="4">4岁</option>
        <option value="5">5岁</option>
        <option value="6">6岁</option>
        <option value="7">7岁</option>
        <option value="8">8岁</option>
        <option value="9">9岁</option>
        <option value="10">10岁</option>
      </select>
    </div>
    <div class="profile-field">
      <label>用户名</label>
      <span id="profile-username" class="profile-username-text"></span>
    </div>
    <div class="profile-divider"></div>
    <div class="profile-field">
      <label>原密码</label>
      <input id="profile-old-pw" class="login-input" type="password" placeholder="输入原密码">
    </div>
    <div class="profile-field">
      <label>新密码</label>
      <input id="profile-new-pw" class="login-input" type="password" placeholder="留空则不修改">
    </div>
    <div id="profile-error" class="login-error hidden"></div>
    <div class="profile-actions">
      <button class="big-btn" onclick="saveProfile()">💾 保存</button>
      <button class="big-btn secondary" onclick="doLogout()">🚪 登出</button>
      <button class="big-btn secondary" onclick="closeProfilePanel()">↩ 关闭</button>
    </div>
  </div>
</div>

<!-- 嘟嘟对话区 -->
<div id="dialogue-container">
  <div id="dudu-avatar">
    <div id="dudu-sprite">🐹</div>
    <div id="dudu-name">嘟嘟</div>
    <div id="dudu-mood">😊</div>
  </div>
  <div id="dialogue-bubble">
    <p id="dialogue-text">加载中...</p>
  </div>
  <div id="dialogue-hint">按 A 键继续</div>
</div>

<!-- 水晶奖励动画（答对时飘出） -->
<div id="crystal-award" class="hidden">
  <div id="crystal-particle">💎</div>
  <div id="crystal-text">+1 💎</div>
</div>

<!-- 答题界面（隐藏） -->
<div id="challenge-panel" class="hidden">
  <div id="challenge-topic"></div>
  <div id="challenge-question"></div>
  <div id="challenge-options"></div>
  <div id="challenge-feedback"></div>
</div>

<!-- 蘑菇屋装饰面板 -->
<div id="house-panel" class="hidden fullscreen-panel">
  <div class="panel-title">🏠 嘟嘟的蘑菇屋</div>
  <div id="house-preview">
    <div class="house-room">
      <div id="house-decor-display">🏠</div>
      <p>已装饰: <span id="house-decor-count">0</span> 件</p>
    </div>
    <div class="house-dudu">
      <div id="house-dudu-sprite">🐹</div>
      <p id="house-dudu-acc">装扮: 无</p>
    </div>
  </div>
  <div class="house-actions">
    <button class="big-btn" onclick="openShop()">🛒 装饰商店</button>
    <button class="big-btn secondary" onclick="closeHouse()">↩ 返回探索</button>
  </div>
</div>

<!-- 商店面板 -->
<div id="shop-panel" class="hidden fullscreen-panel">
  <div class="panel-title">🛒 装饰商店 <span id="shop-balance"></span></div>
  <div id="shop-grid"></div>
  <div class="house-actions">
    <button class="big-btn secondary" onclick="closeShop()">↩ 回蘑菇屋</button>
  </div>
</div>

<!-- 家长报告面板 -->
<div id="report-panel" class="hidden fullscreen-panel">
  <div class="panel-title">📊 学习报告</div>
  <div id="report-content">
    <div class="report-stats" id="report-summary"></div>
    <div class="report-section">
      <h3>📈 知识点能力分布</h3>
      <div id="report-topics"></div>
    </div>
    <div class="report-section">
      <h3>⚠️ 薄弱环节</h3>
      <div id="report-weak"></div>
    </div>
    <div class="report-section">
      <h3>📅 最近7天正确题数</h3>
      <div id="report-chart"></div>
    </div>
  </div>
  <div class="house-actions">
    <button class="big-btn secondary" onclick="closeReport()">↩ 关闭</button>
  </div>
</div>

<!-- 手柄状态指示 -->
<div id="gamepad-indicator">🎮 手柄已连接</div>

<!-- 加载/过渡层 -->
<div id="loading-overlay">
  <div id="loading-text">🌟 数学魔法岛 🌟</div>
  <div id="loading-sub">正在唤醒嘟嘟...</div>
</div>

<!-- 开始提示（按任意键开始，确保音频可播放） -->
<div id="start-hint" class="hidden">
  <div id="start-hint-text">按 A 键或 空格 开始</div>
</div>

<script src="/js/gamepad.js"></script>
<script src="/js/dialogue-ui.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
